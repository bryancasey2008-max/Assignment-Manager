<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel = "stylesheet" type = "text/css" href = "{{ url_for('static', filename='style.css')}}">
    <script src = "{{ url_for('static', filename='script.js') }}" defer></script>
    <title>Add Student</title>
</head>
<body>
    <h1>Add Student</h1>
    <div class = "box" id = "form">
        <form action = "/add-student" method = "POST" onsubmit="validateAssignment(event)">

            <label for "subject">Subject</label>
            <select name = "subject" id = "subject">
                <option value = "Math">Math</option>
                <option value = "English">English</option>
                <option value = "Science">Science</option>
                <option value = "Social Studies">Social Studies</option>
            </select>

            <label for="title">Title</label>
            <p id = "titleCharLength">Characters: 0/50</p>
            <input type = "text" id = "title" name = "title" maxLength = 50>

            <label for="title">Description</label>
            <p id = "descCharLength">Characters: 0/255</p>
            <textarea id = "desc" name = "desc" maxLength = 255></textarea>

            <label for="title">Due Date</label>
            <div class = "row">
                <input id = "month" name = "month" placeholder = "Month">
                <input id = "day" name = "day" placeholder = "Day">
                <input id = "year" name = "year" placeholder = "Year">
            </div>
            <div class = "row">
                <input id = "hour" name = "hour" placeholder = "Hour">
                <input id = "minute" name = "minute" placeholder = "Minute">
                <select id = "AMorPM" name = "AMorPM">
                    <option>AM</option>
                    <option>PM</option>
                </select>
            </div>

            <div class = "buttonDiv">
                <a href="{{ url_for('home') }}" class="buttonOption" id="backBtn">Back</a>
                <button type = "submit"  class="buttonOption" id="submitBtn">Submit</button>
            </div>
            <p id = "message"></p>


        </form>
    </div>
</body>
</html>

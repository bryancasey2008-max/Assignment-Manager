<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel = "stylesheet" type = "text/css" href = "{{ url_for('static', filename='style.css')}}">
    <script src = "{{ url_for('static', filename='script.js') }}"></script>
    <title>Document</title>
</head>
<body>
    <form action = "/add-student" method = "POST" onsubmit="addStudent(event)">

        <label for "subject">Subject</label>
        <select name = "subject" id = "subject">
            <option value = "Math">Math</option>
            <option value = "English">English</option>
            <option value = "Science">Science</option>
            <option value = "Social Studies">Social Studies</option>

        </select>
        <br>

        <label for="title">Title</label>
        <input type = "text" id = "title" name = "title">
        <br>

        <label for="title">Description</label>
        <textarea id = "desc" name = "desc"></textarea>
        <br>

        <label for="title">Due Date</label>
        <br>
        
        <input id = "month" name = "month" placeholder = "Month">
        <input id = "day" name = "day" placeholder = "Day">
        <input id = "year" name = "year" placeholder = "Year">
        <br>

        <input id = "hour" name = "hour" placeholder = "Hour">
        <input id = "minute" name = "minute" placeholder = "Minute">
        <select id = "AMorPM" name = "AMorPM">
            <option>AM</option>
            <option>PM</option>
        </select>

        <button type = "submit">Submit</button>
        <p id = "message"></p>


    </form>
</body>
</html>

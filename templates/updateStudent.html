<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel = "stylesheet" type = "text/css" href = "{{ url_for('static', filename='style.css')}}">
    <script src = "{{ url_for('static', filename='script.js') }}"></script>
    <title>Update Student</title>
</head>
<body>
    <form action = "{{ url_for('updateStudentPage',  assignment_id=assignment.assignment_id) }}" method = "POST">

        <label for "subject">Subject</label>
        <select name = "subject" id = "subject">
            {% for s in ["Math", "English", "Science", "Social Studies"] %}
                <option value = "{{s}}" {{'selected' if form.subject == s }}>{{s}}</option>
            {% endfor %}

        </select>
        <br>

        <label for="title">Title</label>
        <input type = "text" id = "title" name = "title" value = "{{form.title}}">
        <br>

        <label for="title">Description</label>
            <textarea id = "desc" name = "desc">{{form.desc}}</textarea>
        <br>

        <label for="title">Due Date</label>
        <br>
        
        <input id = "month" name = "month" placeholder = "Month" value = "{{form.month}}">
        <input id = "day" name = "day" placeholder = "Day" value = {{form.day}}>
        <input id = "year" name = "year" placeholder = "Year" value = {{form.year}}>
        <br>

        <input id = "hour" name = "hour" placeholder = "Hour" value = "{{form.hour}}">
        <input id = "minute" name = "minute" placeholder = "Minute" value = "{{form.minute}}">
        <select id = "AMorPM" name = "AMorPM">
            
                <option value = "AM" {{'selected' if form.AMorPM == 'AM' }}>AM</option>
                <option value = "PM" {{'selected' if form.AMorPM == 'PM' }}>PM</option>
        </select>

        <button type = "submit">Submit</button>
        <p id = "message"></p>


    </form>
</body>
</html>

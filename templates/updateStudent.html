<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel = "stylesheet" type = "text/css" href = "{{ url_for('static', filename='style.css')}}">
    <script src = "{{ url_for('static', filename='script.js') }}" defer></script>
    <title>Update Student</title>
</head>
<body>
    <h1>Edit Student</h1>
    <div class = "box" id = "form">
        <form action = "{{ url_for('updateStudentPage',  assignment_id=assignment.assignment_id) }}" method = "POST" onsubmit="validateAssignment(event)">

            <label for "subject">Subject</label>
            <select name = "subject" id = "subject">
                {% for s in ["Math", "English", "Science", "Social Studies"] %}
                    <option value = "{{s}}" {{'selected' if form.subject == s }}>{{s}}</option>
                {% endfor %}

            </select>

            <label for="title">Title</label>
            <p id = "titleCharLength">Characters: {{ form.title|length }}/50</p>
            <input type = "text" id = "title" name = "title" value = "{{form.title}}" maxLength = 50>

            <label for="title">Description</label>
            <p id = "descCharLength">Characters: {{ form.desc|length }}/255</p>
            <textarea id = "desc" name = "desc"  maxLength = 255>{{form.desc}}</textarea>

            <label for="title">Due Date</label>
            
            <div class = "row">
                <input id = "month" name = "month" placeholder = "Month" value = "{{form.month}}">
                <input id = "day" name = "day" placeholder = "Day" value = {{form.day}}>
                <input id = "year" name = "year" placeholder = "Year" value = {{form.year}}>
            </div>

            <div class = "row">
                <input id = "hour" name = "hour" placeholder = "Hour" value = "{{form.hour}}">
                <input id = "minute" name = "minute" placeholder = "Minute" value = "{{form.minute}}">
                <select id = "AMorPM" name = "AMorPM">
                    
                    <option value = "AM" {{'selected' if form.AMorPM == 'AM' }}>AM</option>
                    <option value = "PM" {{'selected' if form.AMorPM == 'PM' }}>PM</option>
                </select>
            </div>

                <div class = "buttonDiv">
                    <a href="{{ url_for('home') }}" class="buttonOption" id="backBtn">Back</a>
                    <button type = "submit"  class="buttonOption" id="submitBtn">Submit</button>
                </div>
                <p id = "message"></p>

        </form>
    </div>
</body>
</html>

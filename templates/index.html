<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel = "stylesheet" type = "text/css" href = "{{ url_for('static', filename='style.css')}}">
    <script src = "{{ url_for('static', filename='script.js') }}"></script>
    <title>Document</title>
</head>
<body>
    <h1>Assignment Manager</h1>

    <div id = "navigation">
        <button onclick = "switchDiv('uncomplete')">Uncomplete</button>
        <button onclick = "switchDiv('pastDue')">Past Due</button>
        <button onclick = "switchDiv('completed')">Completed</button>
    </div>

    <button onclick = "switchTheme()" id = "switchThemeBtn">Dark Mode: Off</button>


    <div id = "uncomplete">
        {% if assignments%}

            {% for assignment in assignments %}
                <div id = "assignment">
                    <h2>{{assignment.assignment_subject}}</h2>
                    <h3>{{assignment.title}}</h3>
                    <p>{{assignment.assignment_desc}}</p>
                    
                    <div id = "buttonDiv">
                        <button class = "buttonOption" id = "complete">Complete</button>
                        <button class = "buttonOption" id = "edit" >Edit</button>
                        <form method = "POST" 
                        action = "{{ url_for('delete_assignment', assignment_id=assignment.assignment_id) }}">
                            <button class = "buttonOption" id = "delete">Delete</button>
                        </form>
                    </div>

                </div>
            {% endfor %}
        {%else%}
            <p>No assignments yet</p>
        {% endif %}
    </div>

    <div id = "pastDue">
        Past Due
    </div>

    <div id = "completed">
        Completed
    </div>

    <a href = "{{ url_for('addStudentPage') }}"><button id = "addAssignment">Add Assignment +</button></a>
</body>
</html>
